name: Publicar en GitHub Pages

# Se ejecuta automáticamente cada vez que hay un cambio en la rama main —
# incluyendo los cambios que guarda el panel de administración (/admin), que
# también hacen commit directo a esta rama. También se puede lanzar a mano
# desde la pestaña "Actions" del repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio construido
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

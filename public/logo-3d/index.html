<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADN Emprendedor · Logo 3D</title>
<meta name="description" content="Logo 3D animado de ADN Emprendedor con la forma y los colores de Alumni USB Cali, hecho solo con HTML, CSS y JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Logo 3D de ADN Emprendedor con la forma del logo Alumni USB Cali:
   placa redondeada (azul marino → rosa), marcapáginas naranja que cuelga,
   pastilla naranja inferior. Extrusión por capas en CSS 3D, sin librerías.
   Todas las medidas van en cqw (ancho del logo) para que las proporciones
   sean idénticas en celular y escritorio.
   ========================================================================== */
:root{
  --ink:#1d1d1b; --paper:#f7f5f2; --dim:#c7c4bd;
  --navy:#313467; --plum:#6b3a72; --pink:#ec455f; --orange:#f57206; --orange-site:#ef7d00;
  --step:2.2px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:
    radial-gradient(60% 45% at 30% 30%, rgba(49,52,103,.45), transparent 70%),
    radial-gradient(55% 45% at 75% 65%, rgba(236,69,95,.22), transparent 70%),
    radial-gradient(120% 90% at 50% 0%, #26251f 0%, var(--ink) 55%, #121211 100%);
  color:var(--paper); font-family:'Montserrat', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100svh; padding:24px 16px;
}

/* ---------- 1. contenedor con perspectiva ---------- */
.wrap{
  position:relative; width:min(820px, 100%); aspect-ratio:100/70;
  container-type:inline-size;
  perspective:1100px; perspective-origin:50% 42%;
  cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:pan-y; outline:none;
}
.wrap:focus-visible{ box-shadow:0 0 0 3px rgba(239,125,0,.7); border-radius:24px; }

/* ---------- 2. escena 3D ---------- */
/* Todos los niveles entre la escena y las capas llevan preserve-3d. */
.scene, .sway, .stage, .grp, .layer, .word{ transform-style:preserve-3d; }
.scene{
  position:absolute; inset:0;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .6s cubic-bezier(.16,.8,.3,1);
}
.sway{ position:absolute; inset:0; animation:sway 9s ease-in-out infinite; }
@keyframes sway{
  0%,100%{ transform:rotateY(-14deg) rotateX(6deg); }
  50%    { transform:rotateY(14deg)  rotateX(-4deg); }
}
.stage{ position:absolute; inset:0; }

/* ---------- 5. manchas orgánicas (colores Alumni) que respiran detrás ---------- */
.blobs{ position:absolute; inset:4% 2%; transform:translateZ(-70px); transform-style:preserve-3d; }
.blobs i{
  position:absolute; display:block; filter:blur(10px); opacity:.55;
  border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;
  animation:morph 12s ease-in-out infinite;
}
.blobs .b1{ left:0;   top:0;    width:50%; height:62%; background:radial-gradient(circle at 40% 35%, #4a4f9a, var(--navy) 80%); }
.blobs .b2{ right:0;  top:6%;   width:48%; height:66%; background:radial-gradient(circle at 60% 40%, #ff6b80, var(--pink) 80%); animation-duration:15s; animation-direction:reverse; }
.blobs .b3{ left:30%; top:16%; width:44%; height:42%; background:radial-gradient(circle at 50% 50%, #ff9a3c, var(--orange) 85%); animation-duration:13s; opacity:.32; }
@keyframes morph{
  0%,100%{ border-radius:42% 58% 63% 37% / 41% 44% 56% 59%; }
  33%    { border-radius:63% 37% 38% 62% / 55% 61% 39% 45%; }
  66%    { border-radius:36% 64% 52% 48% / 62% 38% 62% 38%; }
}

/* ---------- sombra proyectada (al revés de la inclinación) ---------- */
.shadow{
  position:absolute; left:50%; top:76%; width:78%; height:16%; border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.7), rgba(0,0,0,.3) 60%, transparent);
  filter:blur(14px);
  transform:translateX(calc(-50% + var(--shx,0px))) translateY(var(--shy,0px)) translateZ(-120px) rotateX(80deg);
  transition:transform .6s cubic-bezier(.16,.8,.3,1);
}

/* ---------- 3. capas (extrusión) ---------- */
.grp{ position:absolute; inset:0; transform:translateZ(var(--z,0px)); }
.layer{
  position:absolute; inset:0; pointer-events:none;
  transform:translateZ(calc(var(--i) * var(--step) * -1));
  transition:transform .55s cubic-bezier(.2,.9,.25,1.15);
  transition-delay:calc(var(--d,0ms) + var(--i) * 40ms);
}
.folded .layer{ transform:translateZ(0); }

/* placa: rectángulo redondeado azul marino → rosa */
.card{
  position:absolute; left:6cqw; right:6cqw; top:12cqw; height:33cqw; border-radius:2.2cqw;
  background:linear-gradient(90deg, var(--navy) 0%, #3e3768 22%, var(--plum) 55%, #b13f66 80%, var(--pink) 100%);
}
.slab .layer:not(.top) .card{ filter:brightness(calc(.72 - var(--t) * .4)); }
/* reflejo que sigue la luz sobre la placa */
.sheen{
  position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(60% 90% at var(--sx,30%) var(--sy,20%), rgba(255,255,255,.28), rgba(255,255,255,0) 60%);
  mix-blend-mode:screen;
}

/* marcapáginas naranja que cuelga por debajo de la placa */
.ribbon{
  position:absolute; left:11.2cqw; width:5.6cqw; top:12cqw; height:45cqw;
  background:linear-gradient(90deg, #ff8a24, var(--orange) 45%, #e66000);
  clip-path:polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 4.2cqw), 0 100%);
}
.rib .layer:not(.top) .ribbon{ background:rgb(var(--rc)); }

/* pastilla naranja inferior */
.pill{
  position:absolute; left:28cqw; right:9cqw; top:40.5cqw; height:8.4cqw; border-radius:1.6cqw;
  background:linear-gradient(180deg, #ff8a24, var(--orange) 55%, #e66400);
}
.pil .layer:not(.top) .pill{ background:rgb(var(--rc)); }
.pill-txt{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:4cqw; letter-spacing:.14em; text-indent:.14em; color:#fff; white-space:nowrap;
  text-shadow:0 .15cqw 0 rgba(120,45,0,.35);
}

/* texto ADN / Emprendedor */
.txt{
  position:absolute; left:21cqw; right:8cqw; top:13cqw; height:27cqw;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'Montserrat', system-ui, sans-serif; line-height:.86;
  user-select:none; -webkit-user-select:none;
}
.word{ display:block; position:relative; white-space:nowrap; }
.w1{ font-weight:800; font-size:19.5cqw; letter-spacing:-0.04em; }
.w2{ font-weight:600; font-size:7.1cqw; letter-spacing:-0.01em; margin-top:.2em; align-self:flex-end; margin-right:3cqw; }
.c{ display:inline-block; animation:wave 3.2s ease-in-out infinite; animation-delay:calc(var(--k) * 90ms); }
@keyframes wave{ 0%,60%,100%{ transform:translateY(0); } 30%{ transform:translateY(-9px); } }

/* capa frontal del texto: degradado + brillo especular (--sx/--sy) por letra */
.letters .top .c{
  color:transparent;
  background-image:
    radial-gradient(circle at var(--sx,30%) var(--sy,25%), #fff 0%, rgba(255,255,255,.95) 8%, rgba(255,255,255,0) 32%),
    linear-gradient(175deg, #ffffff 0%, #fbf4fa 50%, #f1d9e6 100%);
  background-size:var(--lw,100px) var(--lh,100px);
  background-position:calc(var(--ox,0px) * -1) calc(var(--oy,0px) * -1);
  background-repeat:no-repeat;
  -webkit-background-clip:text; background-clip:text;
}

/* 6. clic: las letras saltan */
.boom .c{ animation:jump .7s cubic-bezier(.2,.9,.25,1.3); animation-delay:calc(var(--k) * 40ms); }
@keyframes jump{ 0%{ transform:none; } 40%{ transform:translateY(-26px) rotate(-8deg); } 100%{ transform:none; } }

/* pausa fuera de pantalla */
.paused .sway, .paused .blobs i, .paused .c{ animation-play-state:paused; }

.hint{ margin:16px 0 0; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); text-align:center; }
.gyro{
  margin-top:12px; border:1px solid rgba(239,125,0,.6); background:transparent; color:#ffab1b;
  font:600 12px 'Montserrat', sans-serif; letter-spacing:.12em; text-transform:uppercase;
  padding:10px 16px; border-radius:999px; cursor:pointer;
}
.gyro[hidden]{ display:none; }

/* ---------- 7. reducir movimiento: estático y legible ---------- */
@media (prefers-reduced-motion: reduce){
  .sway, .blobs i, .c, .boom .c{ animation:none !important; }
  .scene, .layer, .shadow{ transition:none !important; }
  .folded .layer{ transform:translateZ(calc(var(--i) * var(--step) * -1)); }
  .sway{ transform:rotateY(-12deg) rotateX(5deg); }
}
</style>
</head>
<body>

<div class="wrap" id="logo" tabindex="0" aria-describedby="logo-hint">
  <div class="scene" id="scene" role="img" aria-label="ADN Emprendedor · Alumni USB Cali">
    <div class="sway">
      <div class="stage" id="stage">
        <div class="shadow" aria-hidden="true"></div>
        <div class="blobs" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
      </div>
    </div>
  </div>
</div>
<p class="hint" id="logo-hint">Mueve el mouse o toca el logo</p>
<button class="gyro" id="gyroBtn" type="button" hidden>Activar movimiento del celular</button>

<script>
(function(){
  'use strict';
  var wrap = document.getElementById('logo');
  var scene = document.getElementById('scene');
  var stage = document.getElementById('stage');
  var gyroBtn = document.getElementById('gyroBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var small = window.matchMedia('(max-width: 640px)').matches;
  var coarse = window.matchMedia('(pointer: coarse)').matches;

  // capas por pieza (escritorio / celular)
  var N_TXT = small ? 10 : 16, N_CARD = small ? 7 : 11, N_RIB = small ? 6 : 9, N_PILL = small ? 5 : 7;
  var WORD1 = 'ADN', WORD2 = 'Emprendedor', PILL = 'ALUMNI · USB CALI';

  function mix(a, b, t){ return a.map(function(v, i){ return Math.round(v + (b[i] - v) * t); }); }
  function letters(txt, start){
    return txt.split('').map(function(ch, i){ return '<span class="c" style="--k:' + (start + i) + '">' + ch + '</span>'; }).join('');
  }
  // cada pieza: grupo con su altura (z) y N copias apiladas hacia atrás
  function group(cls, z, n, delay, inner){
    var h = '<div class="grp ' + cls + '" style="--z:' + z + 'px">';
    for (var L = n; L >= 0; L--) {
      var top = L === 0;
      h += '<div class="layer' + (top ? ' top' : '') + '" style="--i:' + L + ';--t:' + (L / n).toFixed(3) + ';--d:' + delay + 'ms;' + inner.style(L / n, top) + '"' +
        (top ? '' : ' aria-hidden="true"') + '>' + inner.html(top) + '</div>';
    }
    return h + '</div>';
  }

  var html = '';
  // placa (z=0, grosor hacia atrás)
  html += group('slab', 0, N_CARD, 0, {
    style: function(){ return ''; },
    html: function(top){ return '<div class="card">' + (top ? '<div class="sheen"></div>' : '') + '</div>'; }
  });
  // marcapáginas (sobresale un poco de la placa)
  html += group('rib', 8, N_RIB, 120, {
    style: function(t){ return '--rc:' + mix([236, 104, 6], [128, 46, 0], t).join(',') + ';'; },
    html: function(){ return '<div class="ribbon"></div>'; }
  });
  // pastilla
  html += group('pil', 14, N_PILL, 200, {
    style: function(t){ return '--rc:' + mix([228, 98, 4], [120, 44, 0], t).join(',') + ';'; },
    html: function(top){ return '<div class="pill">' + (top ? '<span class="pill-txt">' + PILL + '</span>' : '') + '</div>'; }
  });
  // texto: frontal blanco con brillo; atrás de lila claro a azul marino profundo
  html += group('letters', N_TXT * 2.2 + 4, N_TXT, 260, {
    style: function(t, top){ return top ? '' : 'color:rgb(' + mix([214, 178, 206], [36, 30, 72], t).join(',') + ');'; },
    html: function(){ return '<div class="txt"><span class="word w1">' + letters(WORD1, 0) + '</span><span class="word w2">' + letters(WORD2, WORD1.length) + '</span></div>'; }
  });
  stage.insertAdjacentHTML('beforeend', html);
  stage.classList.add('folded');
  var txtGroup = stage.querySelector('.letters');

  /* ---------- brillo especular: todas las letras frontales comparten un degradado ---------- */
  var frontTxt = stage.querySelector('.letters .top .txt');
  function mapGradient(){
    frontTxt.style.setProperty('--lw', frontTxt.offsetWidth + 'px');
    frontTxt.style.setProperty('--lh', frontTxt.offsetHeight + 'px');
    frontTxt.querySelectorAll('.c').forEach(function(el){
      var x = 0, y = 0, n = el;
      while (n && n !== frontTxt) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
      el.style.setProperty('--ox', x + 'px'); el.style.setProperty('--oy', y + 'px');
    });
  }
  var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(mapGradient);
  window.addEventListener('resize', mapGradient);

  /* ---------- entrada: las capas se despliegan a su profundidad ---------- */
  ready.then(function(){
    if (reduce) { stage.classList.remove('folded'); return; }
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ stage.classList.remove('folded'); }); });
  });

  /* ---------- inclinación ---------- */
  var MAX_MOUSE = 32, MAX_GYRO = 15;
  function tilt(x, y, maxDeg){
    scene.style.setProperty('--ry', (x * maxDeg).toFixed(2) + 'deg');
    scene.style.setProperty('--rx', (-y * maxDeg).toFixed(2) + 'deg');
    scene.style.setProperty('--sx', (50 + x * 100).toFixed(1) + '%');
    scene.style.setProperty('--sy', (40 + y * 100).toFixed(1) + '%');
    scene.style.setProperty('--shx', (-x * 70).toFixed(1) + 'px');
    scene.style.setProperty('--shy', (-y * 26).toFixed(1) + 'px');
  }
  function rest(){ tilt(0, 0, 0); scene.style.removeProperty('--sx'); scene.style.removeProperty('--sy'); }
  if (!reduce) {
    wrap.addEventListener('pointermove', function(e){
      if (e.pointerType === 'touch') return;
      var r = wrap.getBoundingClientRect();
      tilt((e.clientX - r.left) / r.width - .5, (e.clientY - r.top) / r.height - .5, MAX_MOUSE);
    });
    wrap.addEventListener('pointerleave', rest);
  }

  // giroscopio (solo en páginas https; si no hay, queda el balanceo automático)
  function onOrient(e){
    if (e.gamma == null || e.beta == null) return;
    var gx = Math.max(-MAX_GYRO, Math.min(MAX_GYRO, e.gamma));
    var gy = Math.max(-MAX_GYRO, Math.min(MAX_GYRO, e.beta - 45));
    tilt(gx / (MAX_GYRO * 2), gy / (MAX_GYRO * 2), MAX_GYRO * 2);
  }
  if (coarse) document.getElementById('logo-hint').textContent = reduce ? 'Toca el logo' : 'Toca el logo · inclina el celular';
  if (!reduce && coarse && 'DeviceOrientationEvent' in window) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      gyroBtn.hidden = false;   // iOS: permiso tras un toque
      gyroBtn.addEventListener('click', function(){
        DeviceOrientationEvent.requestPermission().then(function(state){
          if (state === 'granted') { window.addEventListener('deviceorientation', onOrient); gyroBtn.hidden = true; }
          else { gyroBtn.textContent = 'Movimiento no permitido'; gyroBtn.disabled = true; }
        }).catch(function(){ gyroBtn.hidden = true; });
      });
    } else {
      window.addEventListener('deviceorientation', onOrient);
    }
  }

  /* ---------- clic / Enter: las letras saltan ---------- */
  function boom(){
    if (reduce) return;
    txtGroup.classList.remove('boom'); void txtGroup.offsetWidth; txtGroup.classList.add('boom');
    clearTimeout(boom.t); boom.t = setTimeout(function(){ txtGroup.classList.remove('boom'); }, 1300);
  }
  wrap.addEventListener('click', boom);
  wrap.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); boom(); } });

  /* ---------- pausar cuando no se ve ---------- */
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(entries){
      entries.forEach(function(en){ wrap.classList.toggle('paused', !en.isIntersecting); });
    }, { threshold: 0.01 }).observe(wrap);
  }
})();
</script>
</body>
</html>
